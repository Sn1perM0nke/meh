name: دانلودر یوتیوب

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube video URL'
        required: true
        type: string

      output_format:
        description: 'Output type'
        required: true
        type: choice
        options:
          - mp4 (video)
          - mp3 (audio only)
        default: 'mp4 (video)'

      desired_quality:
        description: 'Quality preset (video: 144p|360p|480p|720p|1080p; audio: 64|128|192|320kbps)'
        required: false
        type: string
        default: '720p'

      max_part_mb:
        description: 'Maximum part size in MB (0 = do not split, now used only locally)'
        required: false
        type: number
        default: 10

      archive_mode:
        description: 'Archive mode (used only locally now)'
        required: false
        type: choice
        options:
          - none
          - multipart_zip
        default: 'none'

      output_folder:
        description: 'Folder to store downloaded file (unpartitioned in repo)'
        required: false
        type: string
        default: 'downloads'

      job_id:
        description: 'Client-side job id prefix (used for naming only)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  fetch-and-store:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ✅ jq already exists on ubuntu-latest
      # ✅ ffmpeg removed because unused
      # ✅ no apt-get at all

      - name: Retrieve media file
        run: |
          python3 << 'EOF'
          import os, sys, time, re, requests

          URL  = os.environ.get('INPUT_URL')
          FMT  = os.environ.get('INPUT_FORMAT')
          QUAL = os.environ.get('INPUT_QUALITY')
          OUT_DIR = os.environ.get('OUTPUT_DIR')
          JOB_ID = os.environ.get('JOB_ID')

          os.makedirs(OUT_DIR, exist_ok=True)

          is_audio = FMT == 'mp3'

          if is_audio:
              QUAL = QUAL if QUAL in ('64kbps','128kbps','192kbps','320kbps') else '192kbps'
          else:
              QUAL = QUAL if QUAL in ('144p','360p','480p','720p','1080p') else '720p'

          payload = {
              "url": URL,
              "os": "linux",
              "output": {
                  "type": "audio" if is_audio else "video",
                  "format": FMT
              }
          }

          if is_audio:
              payload["audio"] = {"bitrate": QUAL}
          else:
              payload["output"]["quality"] = QUAL

          s = requests.Session()
          s.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          })

          s.get("https://media.ytmp3.gg/")

          resp = s.post(
              "https://hub.ytconvert.org/api/download",
              json=payload,
              timeout=30
          )

          resp.raise_for_status()

          data = resp.json()

          status_url = data.get("statusUrl")
          title = data.get("title", "unknown")

          if not status_url:
              print(data)
              sys.exit(1)

          dl_url = None

          for _ in range(150):
              time.sleep(2)

              r = s.get(status_url, timeout=20)
              status = r.json()

              if status.get("status") == "completed":
                  dl_url = status.get("downloadUrl")
                  break

              if status.get("status") == "failed":
                  print(status)
                  sys.exit(1)

          if not dl_url:
              sys.exit(1)

          vid_match = re.search(r'(?:v=|youtu\.be/)([a-zA-Z0-9_-]{11})', URL)
          V_ID = vid_match.group(1) if vid_match else "unknown"

          clean = re.sub(r'[^a-zA-Z0-9\-_()\[\]]', '_', title.replace(' ', '_'))
          clean = re.sub(r'_+', '_', clean).strip('_')[:60] or V_ID

          BASE_FNAME = f"{clean}_{V_ID}_{QUAL}.{FMT}"

          if JOB_ID:
              FILE_NAME = f"{JOB_ID}_{BASE_FNAME}"
          else:
              FILE_NAME = BASE_FNAME

          out_path = os.path.join(OUT_DIR, FILE_NAME)

          with s.get(dl_url, stream=True) as r:
              r.raise_for_status()

              with open(out_path, "wb") as f:
                  for chunk in r.iter_content(chunk_size=1024 * 1024):
                      if chunk:
                          f.write(chunk)

          if not os.path.exists(out_path) or os.path.getsize(out_path) == 0:
              print("Downloaded file is empty")
              sys.exit(1)

          print(f"Downloaded: {FILE_NAME}")
          EOF
        env:
          INPUT_URL: ${{ github.event.inputs.video_url }}
          INPUT_FORMAT: ${{ github.event.inputs.output_format == 'mp3 (audio only)' && 'mp3' || 'mp4' }}
          INPUT_QUALITY: ${{ github.event.inputs.desired_quality }}
          OUTPUT_DIR: ${{ github.event.inputs.output_folder }}
          JOB_ID: ${{ github.event.inputs.job_id }}

      - name: Push changes to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${{ github.event.inputs.output_folder }}/"

          git commit -m "Download YouTube media [skip ci]" || exit 0

          git push
