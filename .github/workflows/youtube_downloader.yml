name: دانلودر یوتیوب

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube video URL'
        required: true
        type: string

      output_format:
        description: 'Output type'
        required: true
        type: choice
        options:
          - mp4 (video)
          - mp3 (audio only)
        default: 'mp4 (video)'

      desired_quality:
        description: 'Quality preset'
        required: false
        type: string
        default: '720p'

      output_folder:
        description: 'Folder to store downloaded file'
        required: false
        type: string
        default: 'downloads'

      job_id:
        description: 'Client-side job id prefix'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  fetch-and-store:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Retrieve media file
        run: |
          URL="${{ github.event.inputs.video_url }}"
          FORMAT="${{ github.event.inputs.output_format }}"
          QUALITY="${{ github.event.inputs.desired_quality }}"
          OUTPUT="${{ github.event.inputs.output_folder }}"
          JOB_ID="${{ github.event.inputs.job_id }}"

          mkdir -p "$OUTPUT"

          if [[ "$FORMAT" == "mp3 (audio only)" ]]; then
            TYPE="audio"
            EXT="mp3"

            case "$QUALITY" in
              64kbps|128kbps|192kbps|320kbps) ;;
              *) QUALITY="192kbps" ;;
            esac

            JSON_PAYLOAD=$(jq -n \
              --arg url "$URL" \
              --arg bitrate "$QUALITY" \
              '{
                url: $url,
                os: "linux",
                output: {
                  type: "audio",
                  format: "mp3"
                },
                audio: {
                  bitrate: $bitrate
                }
              }')

          else
            TYPE="video"
            EXT="mp4"

            case "$QUALITY" in
              144p|360p|480p|720p|1080p) ;;
              *) QUALITY="720p" ;;
            esac

            JSON_PAYLOAD=$(jq -n \
              --arg url "$URL" \
              --arg quality "$QUALITY" \
              '{
                url: $url,
                os: "linux",
                output: {
                  type: "video",
                  format: "mp4",
                  quality: $quality
                }
              }')
          fi

          echo "Sending request..."

          RESPONSE=$(curl -s \
            -H "User-Agent: Mozilla/5.0" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" \
            https://hub.ytconvert.org/api/download)

          echo "$RESPONSE"

          STATUS_URL=$(echo "$RESPONSE" | jq -r '.statusUrl')
          TITLE=$(echo "$RESPONSE" | jq -r '.title // "unknown"')

          if [[ "$STATUS_URL" == "null" || -z "$STATUS_URL" ]]; then
            echo "Failed to get status URL"
            exit 1
          fi

          echo "Polling conversion..."

          DOWNLOAD_URL=""

          for i in {1..90}; do
            sleep 2

            STATUS_RESPONSE=$(curl -s "$STATUS_URL")

            echo "$STATUS_RESPONSE"

            STATUS=$(echo "$STATUS_RESPONSE" | jq -r '.status')

            if [[ "$STATUS" == "completed" ]]; then
              DOWNLOAD_URL=$(echo "$STATUS_RESPONSE" | jq -r '.downloadUrl')
              break
            fi

            if [[ "$STATUS" == "failed" ]]; then
              echo "Conversion failed"
              exit 1
            fi
          done

          if [[ -z "$DOWNLOAD_URL" ]]; then
            echo "Timed out waiting for download URL"
            exit 1
          fi

          SAFE_TITLE=$(echo "$TITLE" | tr -cd '[:alnum:]_-')

          if [[ -z "$SAFE_TITLE" ]]; then
            SAFE_TITLE="youtube_media"
          fi

          FILE_NAME="${JOB_ID}_${SAFE_TITLE}_${QUALITY}.${EXT}"
          FILE_NAME=$(echo "$FILE_NAME" | sed 's/^_//')

          echo "Downloading..."

          curl -L "$DOWNLOAD_URL" -o "$OUTPUT/$FILE_NAME"

          echo "Saved as $FILE_NAME"

      - name: Push changes to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${{ github.event.inputs.output_folder }}/"

          git commit -m "Download YouTube media [skip ci]" || echo "Nothing to commit"

          git push
