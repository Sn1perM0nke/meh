name: دانلودر یوتیوب

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube video URL'
        required: true
        type: string

      output_format:
        description: 'Output type'
        required: true
        type: choice
        options:
          - mp4 (video)
          - mp3 (audio only)
        default: 'mp4 (video)'

      desired_quality:
        description: 'Quality preset (video: 144p|360p|480p|720p|1080p; audio: 64|128|192|320kbps)'
        required: false
        type: string
        default: '720p'

      max_part_mb:
        description: 'Maximum part size in MB (0 = do not split, now used only locally)'
        required: false
        type: number
        default: 10

      archive_mode:
        description: 'Archive mode (used only locally now)'
        required: false
        type: choice
        options:
          - none
          - multipart_zip
        default: 'none'

      output_folder:
        description: 'Folder to store downloaded file (unpartitioned in repo)'
        required: false
        type: string
        default: 'downloads'

      job_id:
        description: 'Client-side job id prefix (used for naming only)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  fetch-and-store:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ✅ Fast ffmpeg setup instead of apt-get
      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Retrieve media file
        id: retrieval
        run: |
          URL="${{ github.event.inputs.video_url }}"
          FORMAT="${{ github.event.inputs.output_format == 'mp3 (audio only)' && 'mp3' || 'mp4' }}"
          QUAL="${{ github.event.inputs.desired_quality }}"
          OUT_DIR="${{ github.event.inputs.output_folder }}"
          JOB_ID="${{ github.event.inputs.job_id }}"

          mkdir -p "$OUT_DIR"

          # Normalize quality
          if [[ "$FORMAT" == "mp3" ]]; then
            case "$QUAL" in
              64kbps|128kbps|192kbps|320kbps) ;;
              *) QUAL="192kbps" ;;
            esac
          else
            case "$QUAL" in
              144p|360p|480p|720p|1080p) ;;
              *) QUAL="720p" ;;
            esac
          fi

          # Build payload
          if [[ "$FORMAT" == "mp3" ]]; then
            JSON_PAYLOAD=$(jq -n \
              --arg url "$URL" \
              --arg bitrate "$QUAL" \
              '{
                url: $url,
                os: "linux",
                output: {
                  type: "audio",
                  format: "mp3"
                },
                audio: {
                  bitrate: $bitrate
                }
              }')
          else
            JSON_PAYLOAD=$(jq -n \
              --arg url "$URL" \
              --arg quality "$QUAL" \
              '{
                url: $url,
                os: "linux",
                output: {
                  type: "video",
                  format: "mp4",
                  quality: $quality
                }
              }')
          fi

          # Warmup request
          curl -s "https://media.ytmp3.gg/" > /dev/null

          RESPONSE=$(curl -s \
            -H "User-Agent: Mozilla/5.0" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" \
            https://hub.ytconvert.org/api/download)

          echo "$RESPONSE"

          STATUS_URL=$(echo "$RESPONSE" | jq -r '.statusUrl')
          TITLE=$(echo "$RESPONSE" | jq -r '.title // "unknown"')

          if [[ -z "$STATUS_URL" || "$STATUS_URL" == "null" ]]; then
            echo "Failed to get status URL"
            exit 1
          fi

          DL=""

          for i in {1..90}; do
            sleep 2

            STATUS_RESPONSE=$(curl -s "$STATUS_URL")

            STATUS=$(echo "$STATUS_RESPONSE" | jq -r '.status')

            if [[ "$STATUS" == "completed" ]]; then
              DL=$(echo "$STATUS_RESPONSE" | jq -r '.downloadUrl')
              break
            fi

            if [[ "$STATUS" == "failed" ]]; then
              echo "Conversion failed"
              exit 1
            fi
          done

          if [[ -z "$DL" || "$DL" == "null" ]]; then
            echo "Timed out waiting for download URL"
            exit 1
          fi

          V_ID=$(echo "$URL" | grep -oE '([a-zA-Z0-9_-]{11})' | head -1)

          if [[ -z "$V_ID" ]]; then
            V_ID="unknown"
          fi

          CLEAN_TITLE=$(echo "$TITLE" \
            | tr ' ' '_' \
            | sed 's/[^a-zA-Z0-9_-]/_/g' \
            | cut -c1-60)

          CLEAN_TITLE=$(echo "$CLEAN_TITLE" | sed 's/^_*//;s/_*$//')

          if [[ -z "$CLEAN_TITLE" ]]; then
            CLEAN_TITLE="$V_ID"
          fi

          BASE_FNAME="${CLEAN_TITLE}_${V_ID}_${QUAL}.${FORMAT}"

          if [[ -n "$JOB_ID" ]]; then
            FNAME="${JOB_ID}_${BASE_FNAME}"
          else
            FNAME="$BASE_FNAME"
          fi

          echo "$DL" > "$OUT_DIR/.download_info"
          echo "$FNAME" >> "$OUT_DIR/.download_info"
          echo "$FORMAT" >> "$OUT_DIR/.download_info"
          echo "$QUAL" >> "$OUT_DIR/.download_info"

          echo "Ready: $FNAME"

      - name: Download binary (no partitioning on server)
        run: |
          OUTPUT_FOLDER="${{ github.event.inputs.output_folder }}"
          INFO="$OUTPUT_FOLDER/.download_info"

          DL_URL=$(head -1 "$INFO")
          FILE_NAME=$(sed -n '2p' "$INFO")

          mkdir -p "$OUTPUT_FOLDER"

          curl -sL -o "$OUTPUT_FOLDER/$FILE_NAME" "$DL_URL"

          echo "Downloaded $FILE_NAME"

          # cleanup only metadata file; keep media as a single file
          rm -f "$INFO"

      - name: Push changes to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${{ github.event.inputs.output_folder }}/"

          git commit -m "Download YouTube media [skip ci]" || echo "Nothing to commit"

          git push
