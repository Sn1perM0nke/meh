name: Pinterest Debug Test

on:
  workflow_dispatch:
    inputs:
      search_name:
        description: "Search"
        required: true
        default: "cats"

      image_amount:
        description: "Amount"
        required: true
        default: "10"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: System info
        run: |
          echo "Runner started"
          python3 --version
          uname -a

      - name: Install gallery-dl
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y gallery-dl
          which gallery-dl
          gallery-dl --version

      - name: Create folder
        run: |
          mkdir -p download
          ls

      - name: Test internet
        run: |
          curl -I https://www.google.com
          curl -I https://www.pinterest.com

      - name: Download images
        run: |
          set -x

          SEARCH="${{ github.event.inputs.search_name }}"
          COUNT="${{ github.event.inputs.image_amount }}"

          echo "SEARCH=$SEARCH"
          echo "COUNT=$COUNT"

          gallery-dl -v \
            --range 1-$COUNT \
            --http-header "User-Agent: Mozilla/5.0" \
            -D download \
            "https://www.pinterest.com/search/pins/?q=$SEARCH"

      - name: Show results
        if: always()
        run: |
          echo "FILES:"
          find download || true
